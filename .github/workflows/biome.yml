name: Code quality

on:
  push:
    branches: [ main ] # 生产分支为 main
  pull_request:
    branches: [ main ] # 生产分支为 main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      # 用 package.json / lockfile 里锁定的 Biome 版本，不要用 setup-biome 的 version: latest：
      # 上游升小版本会改规则、改 Markdown 格式化，本地能过而 CI 突然红
      # （2026-11-01 就是 CI 装到 2.6.4，Markdown 格式化把 frontmatter 当正文，50 个文件报错）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm exec biome ci ./src --reporter=github
