<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>管理端 · Yuki Blog</title>
		<link rel="icon" href="/favicon/favicon-light-32.png" sizes="32x32" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon/favicon-dark-32.png" sizes="32x32" media="(prefers-color-scheme: dark)" />
		<script>
			// 与主站 Layout.astro 的主题初始化保持一致：hue 与深浅色都从 localStorage 读。
			// 必须内联在 head，否则首屏会先按浅色渲染再翻转。
			(function () {
				var mode = localStorage.getItem("theme") || "system";
				var dark =
					mode === "dark" ||
					(mode === "system" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.style.setProperty(
					"--hue",
					localStorage.getItem("hue") || "180",
				);
			})();
		</script>
	</head>
	<body>
		<div id="app" data-pagefind-ignore></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
